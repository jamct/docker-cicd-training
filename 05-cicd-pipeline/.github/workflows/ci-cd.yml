  #         path: sbom.cdx.json

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production # optional: Freigabe/Schutzregeln in den Repo-Settings
    env:
      # Die Pipeline steuert den Docker-Daemon auf dem Server direkt über SSH.
      # Jeder docker-Befehl in diesem Job läuft dadurch auf dem Server, nicht auf dem Runner.
      DOCKER_HOST: ssh://${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
      # Werte für deploy/docker-compose.yml
      TAG: ${{ github.sha }}
      APP_HOST: ${{ vars.APP_HOST }}
      GREETING: ${{ vars.GREETING }}
    steps:
      # Die Compose-Datei kommt aus dem Repository, nicht vom Server
      - uses: actions/checkout@v4

      - name: SSH-Schlüssel einrichten
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          # Eine SSH-Verbindung für alle docker-Befehle wiederverwenden (schneller)
          cat > ~/.ssh/config <<'CFG'
          Host *
            ControlMaster auto
            ControlPath ~/.ssh/cm-%r@%h:%p
            ControlPersist 60s
          CFG

      - name: Verbindung prüfen
        run: docker version # zeigt Client (Runner) und Server (dein Server)

      # Anmeldedaten bleiben auf dem Runner; der Server bekommt sie nur für den Pull
      - name: Bei der Registry anmelden
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Deployment
        run: |
          # IMAGE kommt aus dem env-Block ganz oben, TAG/APP_HOST/GREETING aus dem Job
          docker compose -f deploy/docker-compose.yml pull
          docker compose -f deploy/docker-compose.yml up -d --remove-orphans
          docker compose -f deploy/docker-compose.yml ps

      - name: Alte Images auf dem Server aufräumen
        run: docker image prune -f
