  #         # Trivy läuft als Container, es muss nichts installiert werden.
  #         # Die SBOM landet als sbom.cdx.json im aktuellen Ordner.
  #         docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD -v "$PWD:/out" \
  #           aquasec/trivy:0.74.0 image \
  #           --format cyclonedx --output /out/sbom.cdx.json \
  #           ${{ env.IMAGE }}:${{ github.sha }}
