  #     - name: SBOM an Dependency-Track hochladen
  #       env:
  #         DTRACK_API_KEY: ${{ secrets.DTRACK_API_KEY }}
  #       run: |
  #         # Gleicher Aufruf wie in Kapitel 09, nur mit Werten aus der Pipeline:
  #         # Projektname = Repository-Name, Version = Commit-SHA (wie der Image-Tag).
  #         # autoCreate=true legt das Projekt beim ersten Mal selbst an.
