name: Lint

on:
  workflow_dispatch:
  # pull_request:
permissions:
  contents: read

jobs:
  eslint:
    name: Lint code
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: ESLint installieren
        run: npm install --no-save eslint@9 @eslint/js@9

      - name: Code prüfen
        run: npx eslint .
