name: compose-zu-k8s

services:

  web:
    image: nginx:1.29-alpine
    restart: unless-stopped

    deploy:
      replicas: 1

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 10s

    networks:
      - proxy

    labels:
      - traefik.enable=true
      - traefik.http.routers.k8sdemo.rule=Host(`${SITE_HOST}`)
      - traefik.http.routers.k8sdemo.entrypoints=websecure
      - traefik.http.routers.k8sdemo.tls.certresolver=le

      - traefik.http.services.k8sdemo.loadbalancer.server.port=80

networks:
  proxy:
    external: true
