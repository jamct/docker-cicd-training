# GitHub Actions: wie Kapitel 05, zusätzlich mit Signatur (Cosign)
#   Test -> Image bauen -> nach GHCR pushen -> SIGNIEREN -> Signatur PRÜFEN -> deployen
#
# Diese Datei ersetzt .github/workflows/ci-cd.yml im Repository aus Kapitel 5:
#   cp pipeline/github-ci-cd.yml <repo>/.github/workflows/ci-cd.yml
# Außerdem muss cosign.pub (der öffentliche Schlüssel) im Repository liegen.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}
  COSIGN_VERSION: v3.1.3

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
        working-directory: app

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          build-args: APP_VERSION=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: sigstore/cosign-installer@v4.1.0
        if: github.event_name == 'push'
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Image signieren
        if: github.event_name == 'push'
        env:
          # Privater Schlüssel und sein Passwort kommen aus den Repo-Secrets.
          COSIGN_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # Immer den DIGEST signieren, nie nur den Tag: Ein Tag kann später
          # auf ein anderes Image zeigen, der Digest nicht.
          # --yes beantwortet die Rückfrage zum öffentlichen Transparenz-Log.
          # Soll der Server mit Podman prüfen (README, Teil 5), zusätzlich
          # --new-bundle-format=false angeben: Podman kennt nur das alte Format.
          cosign sign --yes --key env://COSIGN_KEY "$IMAGE@$DIGEST"

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    env:
      DOCKER_HOST: ssh://${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
      DIGEST: ${{ needs.build.outputs.digest }}
      # NEU: TAG enthält zusätzlich den Digest, z. B. "3f2a…@sha256:9b1c…".
      TAG: ${{ github.sha }}@${{ needs.build.outputs.digest }}
      APP_HOST: ${{ vars.APP_HOST }}
      GREETING: ${{ vars.GREETING }}
    steps:
      # Bringt deploy/docker-compose.yml und cosign.pub mit
      - uses: actions/checkout@v4

      - name: SSH-Schlüssel einrichten
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'CFG'
          Host *
            ControlMaster auto
            ControlPath ~/.ssh/cm-%r@%h:%p
            ControlPersist 60s
          CFG

      - name: Verbindung prüfen
        run: docker version

      - name: Bei der Registry anmelden
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - uses: sigstore/cosign-installer@v4.1.0
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Signatur prüfen
        run: |
          # cosign fragt die Registry direkt (nicht den Server) und nutzt dafür
          # das docker login von eben. Ohne gültige Signatur zu cosign.pub
          # endet der Befehl mit einem Fehler – der Job bricht ab, es wird
          # nichts deployt.
          cosign verify --key cosign.pub "$IMAGE@$DIGEST"

      - name: Deployment
        run: |
          docker compose -f deploy/docker-compose.yml pull
          docker compose -f deploy/docker-compose.yml up -d --remove-orphans
          docker compose -f deploy/docker-compose.yml ps

      - name: Alte Images auf dem Server aufräumen
        run: docker image prune -f
