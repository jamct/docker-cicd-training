# GitLab CI: wie Kapitel 05, zusätzlich mit Signatur (Cosign)
#   Test -> Image bauen -> pushen -> SIGNIEREN -> Signatur PRÜFEN -> deployen
#
# Diese Datei ersetzt .gitlab-ci.yml im Repository aus Kapitel 05:
#   cp pipeline/gitlab-ci.yml <repo>/.gitlab-ci.yml
# Außerdem muss cosign.pub (der öffentliche Schlüssel) im Repository liegen.
stages: [test, build, deploy]

variables:
  IMAGE: $CI_REGISTRY_IMAGE
  COSIGN_VERSION: v3.1.3

# Wiederverwendbarer Baustein: cosign in einen Alpine-basierten Job holen.
# Das Image docker:28 basiert auf Alpine, curl fehlt dort aber.
.cosign-installieren: &cosign-installieren
  - apk add --no-cache curl
  - curl -fsSL -o /usr/local/bin/cosign "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
  - chmod +x /usr/local/bin/cosign
  - cosign version

test:
  stage: test
  image: node:22-alpine
  script:
    - cd app
    - npm test

build:
  stage: build
  image: docker:28
  services:
    - docker:28-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - *cosign-installieren
  script:
    - docker build --build-arg APP_VERSION=$CI_COMMIT_SHA -t $IMAGE:$CI_COMMIT_SHA -t $IMAGE:latest .
    - docker push $IMAGE:$CI_COMMIT_SHA
    - docker push $IMAGE:latest
    # NEU: Digest (sha256:…) des gerade gepushten Images herausfinden.
    # RepoDigests enthält "registry/…/pipeline-demo@sha256:…", wir brauchen den Teil nach dem @.
    - DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' $IMAGE:$CI_COMMIT_SHA | cut -d@ -f2)
    - echo "Digest = $DIGEST"
    # NEU: Signieren. Immer den Digest, nie nur den Tag.
    #   COSIGN_PRIVATE_KEY: CI/CD-Variable vom Typ "File" -> $COSIGN_PRIVATE_KEY ist ein Dateipfad
    #   COSIGN_PASSWORD:    CI/CD-Variable, "Masked" – cosign liest sie von selbst
    #   --yes beantwortet die Rückfrage zum öffentlichen Transparenz-Log.
    #   cosign nutzt das docker login von oben, um die Signatur hochzuladen.
    # Soll der Server mit Podman prüfen (README, Teil 5), zusätzlich
    # --new-bundle-format=false angeben: Podman kennt nur das alte Format.
    - cosign sign --yes --key "$COSIGN_PRIVATE_KEY" "$IMAGE@$DIGEST"
    # Digest an den deploy-Job weitergeben (dotenv-Artefakt wird dort zur Variable)
    - echo "DIGEST=$DIGEST" > build.env
  artifacts:
    reports:
      dotenv: build.env
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy:
  stage: deploy
  image: docker:28
  needs: [build]              # holt auch DIGEST aus build.env
  environment:
    name: production
    url: https://$APP_HOST
  variables:
    DOCKER_HOST: ssh://$DEPLOY_USER@$DEPLOY_HOST
  before_script:
    - apk add --no-cache openssh-client
    - install -m 700 -d ~/.ssh
    - cp "$SSH_PRIVATE_KEY" ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
    - echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - printf 'Host *\n  ControlMaster auto\n  ControlPath ~/.ssh/cm-%%r@%%h:%%p\n  ControlPersist 60s\n' > ~/.ssh/config
    - docker version
    - echo "$CI_DEPLOY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_DEPLOY_USER" --password-stdin
    - *cosign-installieren
  script:
    # NEU: Prüfen vor dem Start. cosign fragt die Registry direkt (nicht den
    # Server) und nutzt das docker login von oben. Ohne gültige Signatur zu
    # cosign.pub bricht der Job hier ab und es wird nichts deployt.
    - cosign verify --key cosign.pub "$IMAGE@$DIGEST"
    # NEU: TAG enthält zusätzlich den Digest, z. B. "3f2a…@sha256:9b1c…".
    # deploy/docker-compose.yml macht daraus ${IMAGE}:3f2a…@sha256:9b1c…
    # Docker zieht dann genau das Image, dessen Signatur wir gerade geprüft haben.
    - export TAG="$CI_COMMIT_SHA@$DIGEST"
    - docker compose -f deploy/docker-compose.yml pull
    - docker compose -f deploy/docker-compose.yml up -d --remove-orphans
    - docker compose -f deploy/docker-compose.yml ps
    - docker image prune -f
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
