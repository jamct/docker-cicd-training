deploy:
  stage: deploy
  # Enthält docker CLI und das Compose-Plugin. Kein docker:dind nötig:
  # Wir benutzen den Docker-Daemon auf dem Server, nicht einen im Runner.
  image: docker:28
  environment:
    name: production
    url: https://$APP_HOST
  variables:
    # Jeder docker-Befehl in diesem Job läuft über SSH auf dem Server
    DOCKER_HOST: ssh://$DEPLOY_USER@$DEPLOY_HOST
    # Werte für deploy/docker-compose.yml (APP_HOST, GREETING als CI/CD-Variablen anlegen)
    TAG: $CI_COMMIT_SHA
  before_script:
    - apk add --no-cache openssh-client
    - install -m 700 -d ~/.ssh
    # SSH_PRIVATE_KEY als Variable vom Typ "File" anlegen
    - cp "$SSH_PRIVATE_KEY" ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
    - echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
    # Eine SSH-Verbindung für alle docker-Befehle wiederverwenden (schneller)
    - printf 'Host *\n  ControlMaster auto\n  ControlPath ~/.ssh/cm-%%r@%%h:%%p\n  ControlPersist 60s\n' > ~/.ssh/config
    - docker version   # zeigt Client (Runner) und Server (dein Server)
    # Anmeldedaten bleiben im Runner; der Server bekommt sie nur für den Pull
    - echo "$CI_DEPLOY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_DEPLOY_USER" --password-stdin
  script:
    - docker compose -f deploy/docker-compose.yml pull
    - docker compose -f deploy/docker-compose.yml up -d --remove-orphans
    - docker compose -f deploy/docker-compose.yml ps
    - docker image prune -f   # alte Images auf dem Server aufräumen
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
